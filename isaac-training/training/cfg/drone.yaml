drone:  
  model_name: "hummingbird"
  # --- Dynamic Uncertainty for Eval ---
  # Set each to true/false to individually enable/disable
  randomization:
    eval:
      # 1. Mass uncertainty: ±15% of nominal (0.716 kg)
      mass_scale: [0.85, 1.15]
      mass_enabled: true
      # 2. Thrust coefficient (KF) via thrust-to-weight ratio: ±15%
      t2w_scale: [0.85, 1.15]
      t2w_enabled: true
      # 3. External wind disturbance (m/s^2 equivalent force/mass)
      #    Applied as constant force per episode in world frame
      wind_speed: [0.0, 1.5]      # wind magnitude range (m/s^2)
      wind_enabled: true
  # --- Controller Evaluation Parameters ---
  controller_eval:
    uc_window: 62       # sliding window W in steps (≈1s at dt=0.016)
    v_floor: 0.1        # normalization floor (m/s), prevents div-by-zero at low speed
    # R_exc threshold: set to nominal U95 after running baseline eval
    # Step 1: run eval with all *_enabled: false, read U95 from WandB
    # Step 2: paste that value here, then run DR eval
    uc_threshold: 30.0  # U_th (%), default 30; replace with nominal U95

sensor:
  lidar_range: 4.
  lidar_vfov: [-10, 20.] # degree
  lidar_vbeams: 4 # number of vertical beams
  lidar_hres: 10. # degree
  