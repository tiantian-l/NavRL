algo:
  feature_extractor:
    learning_rate: 5e-4
    dyn_obs_num: 5
  
  actor:
    learning_rate: 5e-4
    clip_ratio: 0.2
    action_limit: 2.0 # m/s
  
  critic:
    learning_rate: 5e-4
    clip_ratio: 0.1
  
  entropy_loss_coefficient: 1e-4 # encourage exploration
  training_frame_num: 256
  #num_minibatches: 8   # minibatch_size = 64
 # training_frame_num: 32
  training_epoch_num: 4
  num_minibatches: 16 # split into N minibatches