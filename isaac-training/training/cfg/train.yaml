defaults:
  - _self_
  - drone
  - ppo
  - sim

headless: True
device: "cuda:0"
seed: 0

# Total Training Length
max_frame_num: 12e8 # max frame 
eval_interval: 1000 # evaluate the policy for every N training steps
save_interval: 1000

# Training Environment
env:
  num_envs: 4 # Number of drones for training
  max_episode_length: 2200
  env_spacing: 8.0 
  num_obstacles: 350

env_dyn:
  num_obstacles: 80 # set to zero if static env is needed
  vel_range: [0.5, 1.5]
  local_range: [5.0, 5.0, 4.5]

viewer:
  eye: [0., 40., 40.]
  lookat: [0., 2.5, 0.]
  resolution: [960, 720]

wandb:
  project: NavRL
  name: navigation_training
  entity: CERLAB-UAV-RL-Navigation
  mode: offline # online
  run_id: #kw9xf9k9

# Uniform transition data collection during eval (drive-then-probe)
# Set num_steps > 0 to enable; 0 to disable
uniform_data:
  num_steps: 5000       # number of uniform-cmd transitions per eval (0=disabled)
  approach_steps: 80    # steps to drive toward target velocity (~1.28s, ~3 time constants)
  num_probes: 3         # probe commands per approach cycle (amortizes approach cost)
